name: Instalador de Windows

on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Comprobar tipos
        run: npm run typecheck

      - name: Crear instalador LawChest-Setup.exe
        run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}

      - name: Subir instalador como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: LawChest-Instalador-Windows
          path: |
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml
          if-no-files-found: error

      - name: Leer versión
        id: version
        shell: bash
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Publicar versión en Releases (al actualizar main o al crear una etiqueta v*)
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: LawChest v${{ steps.version.outputs.version }}
          # latest.yml y .blockmap los usa LawChest para avisar de las actualizaciones
          files: |
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml
          body: |
            Descarga **LawChest-Setup-${{ steps.version.outputs.version }}.exe** (abajo, en «Assets») y ejecútalo para instalar LawChest.

            Si Windows muestra «Windows protegió su PC», pulsa **Más información → Ejecutar de todas formas** (el programa no está firmado digitalmente).

            Los datos se guardan en `Documentos\LawChest` y no se borran al actualizar ni al desinstalar.
